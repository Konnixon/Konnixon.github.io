<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>SkyOS – Program TV</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css">

<style>
/* ===== EPG STYLE (izolowane, nie nadpisują topbaru) ===== */
#epg-wrapper {
    position: relative;
    height: calc(100vh - 70px);
    overflow: hidden;
    background: radial-gradient(circle at top,#0b1733,#020617);
    padding: 16px 20px;
    box-sizing: border-box;
    color: #f9fafb;
    font-family: system-ui;
}

.epg-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.epg-title {
    font-size: 20px;
    font-weight: 600;
}

.epg-time {
    font-size: 14px;
    color: #9ca3af;
}

.time-row {
    display: flex;
    margin-left: 180px;
    position: relative;
}

.time-slot {
    width: 120px;
    text-align: center;
    font-size: 12px;
    color: #9ca3af;
}

.now-line {
    position: absolute;
    top: 90px;
    bottom: 0;
    width: 2px;
    background: #00b7ff;
    box-shadow: 0 0 12px rgba(0,183,255,.8);
    pointer-events: none;
}

.epg-grid {
    height: calc(100% - 80px);
    overflow-x: auto;
    overflow-y: auto;
    background: linear-gradient(180deg,#050b1f,#020617);
    border-radius: 12px;
    padding: 8px 0;
}

.channel-row {
    display: flex;
    height: 72px;
    align-items: center;
}

.channel-info {
    width: 180px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.channel-logo {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: #111827;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
}

.channel-name {
    font-size: 14px;
    font-weight: 500;
}

.program-track {
    flex: 1;
    position: relative;
    height: 100%;
}

.program {
    position: absolute;
    top: 8px;
    height: 56px;
    border-radius: 10px;
    background: linear-gradient(135deg,#0b1f3b,#12254a);
    border: 1px solid rgba(148,163,184,.35);
    box-shadow: 0 10px 24px rgba(15,23,42,.8);
    padding: 6px 10px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-size: 12px;
    cursor: pointer;
}

.program-title {
    font-weight: 600;
    font-size: 13px;
}

.program-time {
    color: #9ca3af;
    font-size: 11px;
}

.program.current {
    background: linear-gradient(135deg,#0b2f4f,#1d4ed8);
    border-color: #38bdf8;
}

/* ===== MODAL ===== */
.modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
}

.modal {
    width: 420px;
    max-width: 90%;
    background: #020617;
    border-radius: 16px;
    box-shadow: 0 24px 60px rgba(0,0,0,.9);
    padding: 18px 20px;
    border: 1px solid rgba(148,163,184,.4);
}

.modal-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 6px;
}

.modal-time {
    font-size: 13px;
    color: #9ca3af;
    margin-bottom: 10px;
}

.modal-desc {
    font-size: 13px;
    color: #e5e7eb;
    margin-bottom: 16px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

.btn {
    padding: 8px 14px;
    border-radius: 999px;
    border: none;
    font-size: 13px;
    cursor: pointer;
}

.btn-primary {
    background: #00b7ff;
    color: #020617;
    font-weight: 600;
}

.btn-secondary {
    background: #111827;
    color: #e5e7eb;
}
</style>

</head>

<body>

<!-- ===== TOPBAR (zachowuje styl z style.css) ===== -->
<nav class="topbar">
    <a href="aplikacje.html" tabindex="0">APLIKACJE</a>
    <a href="index.html" tabindex="0">STRONA GŁÓWNA</a>
    <a href="kanaly.html" tabindex="0">KANAŁY TV</a>
    <a href="programtv.html" tabindex="0" class="active">PROGRAM TV</a>
    <a href="sklep.html" tabindex="0">SKLEP</a>
    <a href="ustawienia.html" tabindex="0">USTAWIENIA</a>
    <span class="version">11.0</span>
</nav>

<!-- ===== EPG ===== -->
<div id="epg-wrapper">
    <div class="epg-header">
        <div class="epg-title">SkyOS Guide – Program TV</div>
        <div class="epg-time" id="clock"></div>
    </div>

    <div class="time-row" id="timeRow"></div>
    <div class="now-line" id="nowLine"></div>

    <div class="epg-grid" id="epgGrid"></div>
</div>

<!-- ===== MODAL ===== -->
<div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-time" id="modalTime"></div>
        <div class="modal-desc" id="modalDesc"></div>
        <div class="modal-actions">
            <button class="btn btn-secondary" id="modalClose">Zamknij</button>
            <button class="btn btn-primary">Oglądaj</button>
        </div>
    </div>
</div>

<script>
/* ============================================================
   1. LISTA KANAŁÓW (BBC One automatycznie)
   ============================================================ */
const channelFiles = [
    "https://www.bbc.co.uk/schedules/p00fzl6p.json", // BBC One
];

/* ============================================================
   2. KONWERSJA BBC JSON → TWÓJ FORMAT
   ============================================================ */
function convertTime(iso){
    const d = new Date(iso);
    const hh = String(d.getHours()).padStart(2,"0");
    const mm = String(d.getMinutes()).padStart(2,"0");
    return `${hh}:${mm}`;
}

async function loadChannel(file){
    const res = await fetch(file);
    const data = await res.json();

    if(data.broadcasts){
        return {
            name: "BBC One",
            logo: "BBC One.png",
            programs: data.broadcasts.map(p => ({
                title: p.title,
                start: convertTime(p.start),
                end: convertTime(p.end),
                desc: p.short_synopsis || ""
            }))
        };
    }

    return data;
}

/* ============================================================
   3. RENDER CZASU
   ============================================================ */
const dayStart = "06:00";
const dayEnd = "24:00";

function parseTime(str){
    const [h,m] = str.split(":").map(Number);
    return h*60 + m;
}

const startMinutes = parseTime(dayStart);
const endMinutes = parseTime(dayEnd);

function renderTimeRow(){
    const row = document.getElementById("timeRow");
    const minuteWidth = 4;

    for(let t = startMinutes; t <= endMinutes; t += 60){
        const slot = document.createElement("div");
        slot.className = "time-slot";
        const h = String(Math.floor(t/60)).padStart(2,"0");
        slot.textContent = `${h}:00`;
        slot.style.width = (60 * minuteWidth) + "px";
        row.appendChild(slot);
    }
}

/* ============================================================
   4. RENDER EPG
   ============================================================ */
async function renderEPG(){
    const epgGrid = document.getElementById("epgGrid");
    const channels = [];

    for(const file of channelFiles){
        channels.push(await loadChannel(file));
    }

    const minuteWidth = 4;

    channels.forEach((channel, chIndex)=>{
        const row = document.createElement("div");
        row.className = "channel-row";

        const info = document.createElement("div");
        info.className = "channel-info";

        const logo = document.createElement("div");
        logo.className = "channel-logo";
        logo.textContent = channel.logo || channel.name.slice(0,3);

        const name = document.createElement("div");
        name.className = "channel-name";
        name.textContent = channel.name;

        info.appendChild(logo);
        info.appendChild(name);

        const track = document.createElement("div");
        track.className = "program-track";

        channel.programs.forEach(p=>{
            const start = parseTime(p.start);
            const end = parseTime(p.end);
            const duration = end - start;

            const left = (start - startMinutes) * minuteWidth;
            const width = duration * minuteWidth;

            const prog = document.createElement("div");
            prog.className = "program";
            prog.style.left = left + "px";
            prog.style.width = width + "px";

            prog.innerHTML = `
                <div class="program-title">${p.title}</div>
                <div class="program-time">${p.start} – ${p.end}</div>
            `;

            track.appendChild(prog);
        });

        row.appendChild(info);
        row.appendChild(track);
        epgGrid.appendChild(row);
    });

    scrollToNow();
}

/* ============================================================
   5. NOW LINE
   ============================================================ */
function scrollToNow(){
    const now = new Date();
    const minutesNow = now.getHours()*60 + now.getMinutes();
    const offsetMinutes = Math.max(0, minutesNow - startMinutes);

    const px = offsetMinutes * 4;
    document.getElementById("epgGrid").scrollLeft = px - 200;

    document.getElementById("nowLine").style.left = (180 + px) + "px";
}

/* ============================================================
   6. CLOCK
   ============================================================ */
function updateClock(){
    const now = new Date();
    const h = String(now.getHours()).padStart(2,"0");
    const m = String(now.getMinutes()).padStart(2,"0");
    document.getElementById("clock").textContent = `Teraz: ${h}:${m}`;
}

/* ============================================================
   7. START
   ============================================================ */
(async function init(){
    updateClock();
    setInterval(updateClock, 30000);

    renderTimeRow();
    await renderEPG();
})();
</script>

</body>
</html>
